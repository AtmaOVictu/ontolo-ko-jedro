name: pregled-odvisnosti ( dependency review )
on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: pregled odvisnosti ( npm ∧ pip )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
