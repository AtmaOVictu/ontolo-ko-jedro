# CI — TEHNIKA kit (⟡ ukaz »stori«, 17. 11. 2026): zelena sodba vsakega potega.
# Namestitev · lint · izgradnja: predstavitvena plast se gradi javno ⊢.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
